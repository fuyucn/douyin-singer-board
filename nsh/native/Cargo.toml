[package]
name = "sususongboard-sqlite"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The fork carries the Windows input and startup fixes.
nsh-core = { git = "https://github.com/fuyucn/nsh", rev = "b8553486" }
nsh-base = { git = "https://github.com/fuyucn/nsh", rev = "b8553486" }
# Bundled everywhere: one SQLite version on macOS, Windows, Linux and Android,
# no pkg-config/Homebrew leakage into the shipped binary.
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
