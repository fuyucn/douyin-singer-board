name: SongBoard stable signed updates

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Numeric build number greater than every previously published stable updater build
        required: true
        type: number

permissions:
  contents: read

jobs:
  signed-packages:
    name: Signed ${{ matrix.target }} stable update
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos_arm64
          - runner: windows-latest
            target: windows_x64
    defaults:
      run:
        shell: bash
        working-directory: nsgo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nsgo-app/go.mod
          cache-dependency-path: nsgo-app/go.sum
      - name: Verify runner architecture
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Install NSIS on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check version rules
        run: node --test scripts/bump-patch.test.mjs
      - name: Run offline tests
        run: go test ./... -count=2 -skip '^(TestLiveDouyinConnection|TestPublicPlatformSearch)$'
      - name: Check NSGo project
        run: go tool nsgo check ./...
      - name: Build and verify signed stable installer and appcast
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
          SONGBOARD_UPDATE_PUBLIC_KEY: ${{ vars.SONGBOARD_UPDATE_PUBLIC_KEY }}
          SONGBOARD_UPDATE_FEED: ${{ vars.SONGBOARD_UPDATE_FEED }}
          SONGBOARD_MAC_SIGN_IDENTITY: ${{ secrets.SONGBOARD_MAC_SIGN_IDENTITY }}
          SONGBOARD_MAC_NOTARY_PROFILE: ${{ secrets.SONGBOARD_MAC_NOTARY_PROFILE }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPDATE_TARGET: ${{ matrix.target }}
        run: go run ./scripts/update-release -channel stable -target "$UPDATE_TARGET" -build-number "$BUILD_NUMBER" -output dist/signed-stable
      - uses: actions/upload-artifact@v4
        with:
          name: signed-stable-${{ matrix.target }}
          path: nsgo-app/dist/signed-stable/*
          if-no-files-found: error
