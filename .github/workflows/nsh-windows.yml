name: NSH Windows

on:
  push:
    branches: [nsh]
    paths:
      - "nsh/**"
      - ".github/workflows/nsh-windows.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: nsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # nsh.dev/install.ps1 fetches a .sha256 sidecar that currently returns
          # 504 on GitHub's release CDN. Fetch both assets through the GitHub
          # API with gh, verify the checksum ourselves, then unpack.
          $tmp = "$env:TEMP\nsh-unpack"
          $zip = "$env:TEMP\nsh-windows-x86_64.zip"
          $sum = "$zip.sha256"
          $dest = "$env:LOCALAPPDATA\nsh"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              gh release download nightly --repo longbridge/nsh `
                --pattern "nsh-windows-x86_64.zip" `
                --pattern "nsh-windows-x86_64.zip.sha256" `
                --dir $env:TEMP --clobber
              $expected = (Get-Content -Raw -LiteralPath $sum).Trim().Split(" ")[0].ToUpper()
              $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToUpper()
              if ($expected -ne $actual) { throw "checksum mismatch: $actual vs $expected" }
              $ok = $true
            } catch {
              Write-Host "NSH download attempt $i failed: $_"
              if ($i -lt 3) { Start-Sleep -Seconds (10 * $i) }
            }
          }
          if (-not $ok) { throw "NSH nightly download failed after 3 attempts" }
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path (Join-Path $tmp "nsh") "*") -Destination $dest -Recurse -Force
          if (-not (Test-Path (Join-Path $dest "bin\nsh.exe"))) { throw "nsh.exe missing after unpack" }
          (Join-Path $dest "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check NSH
        run: nsh -V

      - name: Install Rust for native SQLite
        uses: dtolnay/rust-toolchain@stable

      # Compiling rusqlite's bundled SQLite and the host crates is the only
      # slow step here (cold: ~3 min for a package, ~50 s for the native tests;
      # warm: 4 s and 0.5 s). Cached by Cargo.lock and the flags, which the
      # config below fixes.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nsh/target
            ${{ github.workspace }}/nsh/native/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nsh/native/Cargo.lock', 'nsh/.cargo/config.toml', 'nsh/native/Cargo.toml') }}-${{ hashFiles('nsh/native/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nsh/native/Cargo.lock', 'nsh/.cargo/config.toml', 'nsh/native/Cargo.toml') }}-

      - name: SQLite durability and recovery tests
        run: cargo test --manifest-path native/Cargo.toml --locked

      - name: Unit tests
        run: |
          nsh test src/matcher.test.ts
          nsh test src/autoSync.test.ts
          nsh test log.test.tsx
          nsh test sqlite-store.test.tsx
          nsh test platform.test.tsx

      # The platform is a plugin now: its suites need a real WebView and a real
      # data directory, so they run with `--target windows`.
      - name: UI test
        run: |
          nsh test table-actions-target.test.tsx --target windows
          nsh test text-layout.test.tsx
          nsh test sqlite-store.test.tsx --target windows
          nsh test board.test.tsx --target windows
          nsh test parity.test.tsx --target windows
          nsh test actions.test.tsx --target windows
          nsh test kugou-ui.test.tsx --target windows
          nsh test text-overlay.test.tsx --target windows

      # The plugin channel runs a third-party page in a hidden WebView, so this
      # is also the check that the Windows image has a WebView engine.
      - name: Plugin channel test
        run: |
          nsh test plugin.test.tsx --target windows
          nsh test plugin-compat.test.tsx --target windows
          nsh test netease.test.tsx --target windows
          nsh test scripts/kat-kugou-plugin.test.tsx --target windows > kat-kugou.txt 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content kat-kugou.txt; throw "plugin KAT failed" }
          node scripts/kat-kugou-plugin.mjs kat-kugou.txt

      - name: Text overlay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-overlay-windows
          path: text-overlay.png
          if-no-files-found: ignore

      - name: Auto-sync worker test
        run: nsh test sync-worker.test.tsx --target windows

      - name: Icon button geometry
        run: nsh test geometry.test.tsx

      - name: Icon button parity guard
        shell: pwsh
        run: |
          python scripts/check_icon_buttons.py
          python scripts/check_versions.py

      - name: WebSocket Cookie header (non-blocking)
        run: nsh test ws-cookie.test.ts
        continue-on-error: true

      - name: Kugou login QR (non-blocking)
        run: nsh test kugou-ui.test.tsx
        continue-on-error: true

      - name: Package app
        run: nsh package Board.tsx --target windows --name SUSUSongBoard -o dist

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\installer.nsi'

      - name: Build portable exe
        shell: powershell
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\portable.nsi'

      - name: Smoke portable exe
        shell: pwsh
        run: |
          Start-Process "dist\SUSUSongBoard-Portable-0.43.2.exe"
          Start-Sleep -Seconds 10
          $app = Get-Process SUSUSongBoard -ErrorAction SilentlyContinue
          if (-not $app) { throw "portable exe did not start the app" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\SUSUSongBoard\nsh\bundle.nshc")) { throw "payload not extracted" }
          $app | Select-Object Id, Path
          Stop-Process -Name SUSUSongBoard -Force

      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-windows
          path: |
            nsh/dist/SUSUSongBoard.zip
            nsh/dist/SUSUSongBoard-Setup-0.43.2.exe
            nsh/dist/SUSUSongBoard-Portable-0.43.2.exe
          if-no-files-found: error
