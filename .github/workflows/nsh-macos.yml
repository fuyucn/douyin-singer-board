name: NSH macOS

# Packages the NSH app for Apple Silicon (and, when the runner exists, Intel)
# and keeps the tests that only run on a real macOS renderer.
on:
  push:
    branches: [nsh]
    paths:
      - "nsh/**"
      - ".github/workflows/nsh-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nsh

jobs:
  build:
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel. Both labels are current GitHub-hosted
          # macOS images; `macos-13` has been retired.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # nsh.dev's installer verifies a .sha256 sidecar on the release CDN,
          # which currently returns 504. Fetch both assets through the GitHub
          # API and verify the checksum here, as the Windows job does.
          tmp=$(mktemp -d)
          asset="nsh-macos-${{ matrix.arch }}.tar.gz"
          gh release download nightly --repo longbridge/nsh \
            --pattern "$asset" --pattern "$asset.sha256" \
            --dir "$tmp" --clobber
          cd "$tmp"
          shasum -a 256 -c "$asset.sha256"
          mkdir -p "$HOME/.nsh"
          tar -xzf "$asset"
          cp -R nsh/. "$HOME/.nsh/"
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"

      - name: Check NSH
        run: nsh -V

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Compiling rusqlite's bundled SQLite and the host crates is the only
      # slow step here (cold: ~3 min for a package, ~50 s for the native tests;
      # warm: 4 s and 0.5 s). Cached by Cargo.lock and the flags, which the
      # config below fixes.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/nsh/target
            ${{ github.workspace }}/nsh/native/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nsh/native/Cargo.lock', 'nsh/.cargo/config.toml', 'nsh/native/Cargo.toml') }}-${{ hashFiles('nsh/native/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('nsh/native/Cargo.lock', 'nsh/.cargo/config.toml', 'nsh/native/Cargo.toml') }}-

      - name: Rust store tests
        run: cargo test --manifest-path native/Cargo.toml --locked

      # No WebView here: only suites that never touch a platform.
      - name: Headless tests
        run: |
          nsh test sqlite-store.test.tsx
          nsh test platform.test.tsx
          nsh test log.test.tsx
          nsh test text-layout.test.tsx
          nsh test geometry.test.tsx

      # The platform is a plugin now: its suites need a real WebView and a real
      # data directory, so they run on the renderer instead.
      - name: Real macOS renderer tests
        run: |
          nsh test table-actions-target.test.tsx --target macos
          nsh test board.test.tsx --target macos
          nsh test parity.test.tsx --target macos
          nsh test actions.test.tsx --target macos
          nsh test sync-worker.test.tsx --target macos
          nsh test kugou-ui.test.tsx --target macos
          nsh test plugin.test.tsx --target macos
          nsh test plugin-compat.test.tsx --target macos
          nsh test netease.test.tsx --target macos

      # The plugin's crypto, as a page computes it (needs a real WebView).
      - name: KuGou plugin crypto KAT (page vs Node)
        run: |
          nsh test scripts/kat-kugou-plugin.test.tsx --target macos > kat-kugou.txt 2>&1
          node scripts/kat-kugou-plugin.mjs kat-kugou.txt

      - name: Icon button and version guards
        run: |
          python3 scripts/check_icon_buttons.py
          python3 scripts/check_versions.py

      - name: Package app
        run: nsh package Board.tsx --target macos -o dist --name SUSUSongBoard

      - name: Verify bundle
        run: |
          set -euo pipefail
          app="dist/SUSUSongBoard.app/Contents/MacOS/SUSUSongBoard"
          test -x "$app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" \
            dist/SUSUSongBoard.app/Contents/Info.plist | grep -qx "com.sususongboard.app"
          # The bundled SQLite must not turn into a Homebrew dependency.
          if otool -L "$app" | grep -q sqlite3; then
            echo "the app links an external sqlite3"; exit 1
          fi
          version=$(python3 -c 'import json;print(json.load(open("nsh.json"))["version"])')
          ditto -c -k --sequesterRsrc --keepParent dist/SUSUSongBoard.app \
            "dist/SUSUSongBoard-${version}-macos-${{ matrix.arch }}.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-macos-${{ matrix.arch }}
          path: nsh/dist/SUSUSongBoard-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
