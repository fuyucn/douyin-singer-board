name: NSH Windows runtime test

on:
  workflow_dispatch:
    inputs:
      render_test:
        description: Run the 150% input pixel test
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # The dev host's threads take RUST_MIN_STACK: upstream's CI sets 256 MiB
    # because the debug build's frames overflow the 2 MiB default (its own
    # Windows job does the same for every test it runs).
    env:
      RUST_MIN_STACK: "268435456"
    defaults:
      run:
        working-directory: nsh
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = "$env:TEMP\nsh-unpack"
          $zip = "$env:TEMP\nsh-windows-x86_64.zip"
          gh release download nightly --repo longbridge/nsh --pattern "nsh-windows-x86_64.zip" --dir $env:TEMP --clobber
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $dest = "$env:LOCALAPPDATA\nsh"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path (Join-Path $tmp "nsh") "*") -Destination $dest -Recurse -Force
          (Join-Path $dest "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install the startup fix runtime (fork main 3531e8cf)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = "$env:LOCALAPPDATA\nsh\runtime\windows"
          $base = "https://github.com/fuyucn/nsh/releases/download/test-runtime-startup-3531e8cf"
          Invoke-WebRequest "$base/nsh-windows-app.exe" -OutFile "$rt\nsh-windows-app.exe"
          Invoke-WebRequest "$base/nsh-windows-host.exe" -OutFile "$rt\nsh-windows-host.exe"
          Get-Item "$rt\nsh-windows-app.exe" | Select-Object Length

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nsh/native/target
          key: ssb-runtime-test-${{ hashFiles('nsh/native/Cargo.lock') }}
          restore-keys: ssb-runtime-test-

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # The runtime forces 150% to match the user's display scale; check the
      # text inside the field and its selection fill before packaging.
      - name: Input rendering test at a forced 150%
        if: ${{ inputs.render_test }}
        shell: pwsh
        env:
          NSH_TEST_SCALE: "1.5"
        run: |
          $ErrorActionPreference = "Stop"
          nsh test win-input.test.tsx --target windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item win-input-value.png win-input-1.5-value.png
          Move-Item win-input-selected.png win-input-1.5-selected.png
          Move-Item win-input-faces.png win-input-1.5-faces.png

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.render_test }}
        with:
          name: win-input-screenshots
          path: |
            nsh/win-input-1.5-value.png
            nsh/win-input-1.5-selected.png
            nsh/win-input-1.5-faces.png
          if-no-files-found: error

      - name: Check the input's pixels
        if: ${{ inputs.render_test }}
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_check_win_input.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_win_input.py --scale 1.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nsh --version
          nsh build Board.tsx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $appId = "com.sususongboard.runtime-test.$testId"
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class WindowCheck {
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr handle);
          }
          "@
          $env:RUST_LOG = "debug"
          $tracePath = Join-Path $env:TEMP "nsh-windows-startup-trace.log"
          if (Test-Path $tracePath) { Clear-Content $tracePath }
          $env:NSH_RUNTIME = Join-Path $env:LOCALAPPDATA "nsh\runtime"
          $smokeId = "$appId.smoke"
          nsh package startup-smoke --target windows -o smoke-dist --name StartupSmoke --id $smokeId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smoke = Start-Process -FilePath "$PWD\smoke-dist\StartupSmoke\StartupSmoke.exe" -PassThru
          $smokeDeadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $smoke.Refresh()
          } while (-not $smoke.HasExited -and ($smoke.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($smoke.MainWindowHandle)) -and (Get-Date) -lt $smokeDeadline)
          if ($smoke.HasExited -or $smoke.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($smoke.MainWindowHandle)) {
            $smokeLog = Join-Path $env:APPDATA "$smokeId\logs\app.log"
            $smokeDiagnostic = @("Smoke app ID: $smokeId", "Process ID: $($smoke.Id)", "Main window handle: $($smoke.MainWindowHandle)")
            if (Test-Path $smokeLog) { $smokeDiagnostic += Get-Content $smokeLog -Tail 200 } else { $smokeDiagnostic += "No app log: $smokeLog" }
            if (Test-Path $tracePath) { $smokeDiagnostic += Get-Content $tracePath -Tail 100 } else { $smokeDiagnostic += "No runner startup trace: $tracePath" }
            $smokeDiagnostic | Set-Content smoke-dist\StartupSmoke\startup-diagnostics.txt
            Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue
            throw "Minimal packaged NSH app did not show a visible window"
          }
          Stop-Process -Id $smoke.Id -Force
          if (Test-Path $tracePath) { Clear-Content $tracePath }
          $env:NSH_RUNTIME = Join-Path $env:LOCALAPPDATA "nsh\runtime"
          nsh package Board.tsx --target windows -o dist --name SUSUSongBoard --id $appId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ testId = $testId; appId = $appId; appCommit = $env:GITHUB_SHA; runtimeCommit = "3531e8cf" } |
            ConvertTo-Json | Set-Content dist\SUSUSongBoard\runtime-test.json
          $app = Start-Process -FilePath "$PWD\dist\SUSUSongBoard\SUSUSongBoard.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $app.Refresh()
          } while (-not $app.HasExited -and ($app.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($app.MainWindowHandle)) -and (Get-Date) -lt $deadline)
          if ($app.HasExited) { throw "Packaged app exited with code $($app.ExitCode)" }
          if ($app.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($app.MainWindowHandle)) {
            $diagnostic = @(
              "App ID: $appId"
              "Process ID: $($app.Id)"
              "Main window handle: $($app.MainWindowHandle)"
              "Main window title: $($app.MainWindowTitle)"
              "Window visible: $([WindowCheck]::IsWindowVisible($app.MainWindowHandle))"
            )
            $logPath = Join-Path $env:APPDATA "$appId\logs\app.log"
            if (Test-Path $logPath) {
              $diagnostic += Get-Content $logPath -Tail 200
            } else {
              $diagnostic += "No app log: $logPath"
            }
            if (Test-Path $tracePath) { $diagnostic += Get-Content $tracePath -Tail 100 } else { $diagnostic += "No runner startup trace: $tracePath" }
            $diagnostic | Set-Content dist\SUSUSongBoard\startup-diagnostics.txt
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged app stayed alive without a visible main window"
          }
          Stop-Process -Id $app.Id -Force
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DRUNTIME_TEST_ID=$testId" installer\portable.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-startup-diagnostics
          path: |
            nsh/dist/SUSUSongBoard/startup-diagnostics.txt
            nsh/smoke-dist/StartupSmoke/startup-diagnostics.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-runtime-test
          path: nsh/dist/SUSUSongBoard-Portable-0.43.4.exe
          if-no-files-found: error
