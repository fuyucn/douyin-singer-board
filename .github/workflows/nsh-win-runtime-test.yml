name: NSH Windows runtime test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # The dev host's threads take RUST_MIN_STACK: upstream's CI sets 256 MiB
    # because the debug build's frames overflow the 2 MiB default (its own
    # Windows job does the same for every test it runs).
    env:
      RUST_MIN_STACK: "268435456"
    defaults:
      run:
        working-directory: nsh
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tmp = "$env:TEMP\nsh-unpack"
          $zip = "$env:TEMP\nsh-windows-x86_64.zip"
          gh release download nightly --repo longbridge/nsh --pattern "nsh-windows-x86_64.zip" --dir $env:TEMP --clobber
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $dest = "$env:LOCALAPPDATA\nsh"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path (Join-Path $tmp "nsh") "*") -Destination $dest -Recurse -Force
          (Join-Path $dest "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install the test runtime (fork main c9575535)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = "$env:LOCALAPPDATA\nsh\runtime\windows"
          $base = "https://github.com/fuyucn/nsh/releases/download/test-runtime-c9575535"
          Invoke-WebRequest "$base/nsh-windows-app.exe" -OutFile "$rt\nsh-windows-app.exe"
          Invoke-WebRequest "$base/nsh-windows-host.exe" -OutFile "$rt\nsh-windows-host.exe"
          Get-Item "$rt\nsh-windows-app.exe" | Select-Object Length

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nsh/native/target
          key: ssb-runtime-test-${{ hashFiles('nsh/native/Cargo.lock') }}
          restore-keys: ssb-runtime-test-

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      # The field's pixels at the machine's own scale (the control) and at a
      # forced 150% (NSH_TEST_SCALE, the runtime stands in for a monitor the
      # runner does not have): the text inside the field, as tall as the
      # mirror's, and a selection fill wide enough to see. The test names its
      # screenshots plainly; each step renames them by its scale, and
      # scripts/check_win_input.py measures both runs and fails the run on
      # either.
      # The dev host still cannot start on the runner (an upstream main
      # regression, being bisected), so these run for their screenshots when
      # the host connects and stay non-blocking until it does.
      - name: Input rendering test at the machine's scale
        continue-on-error: true
        shell: pwsh
        run: |
          nsh test win-input.test.tsx --target windows
          Move-Item win-input-value.png win-input-1.0-value.png -ErrorAction SilentlyContinue
          Move-Item win-input-selected.png win-input-1.0-selected.png -ErrorAction SilentlyContinue
          Move-Item win-input-faces.png win-input-1.0-faces.png -ErrorAction SilentlyContinue

      - name: Input rendering test at a forced 150%
        continue-on-error: true
        shell: pwsh
        env:
          NSH_TEST_SCALE: "1.5"
        run: |
          nsh test win-input.test.tsx --target windows
          Move-Item win-input-value.png win-input-1.5-value.png -ErrorAction SilentlyContinue
          Move-Item win-input-selected.png win-input-1.5-selected.png -ErrorAction SilentlyContinue
          Move-Item win-input-faces.png win-input-1.5-faces.png -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: win-input-screenshots
          path: |
            nsh/win-input-1.0-value.png
            nsh/win-input-1.0-selected.png
            nsh/win-input-1.0-faces.png
            nsh/win-input-1.5-value.png
            nsh/win-input-1.5-selected.png
            nsh/win-input-1.5-faces.png
          if-no-files-found: error

      - name: Check the input's pixels
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python scripts/check_win_input.py --scale 1.0
          python scripts/check_win_input.py --scale 1.5

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          nsh --version
          nsh build Board.tsx
          nsh package Board.tsx --target windows -o dist --name SUSUSongBoard
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\portable.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-runtime-test
          path: nsh/dist/SUSUSongBoard-Portable-0.43.4.exe
          if-no-files-found: error
