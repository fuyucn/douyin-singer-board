name: SongBoard acceptance evidence

on:
  workflow_dispatch:
  push:
    branches: [feat/align-main]
    paths:
      - nsgo-app/**
      - .github/workflows/nsgo-acceptance.yml
  pull_request:
    paths:
      - nsgo-app/**
      - .github/workflows/nsgo-acceptance.yml

permissions:
  contents: read

jobs:
  desktop:
    name: Native evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nsgo-app
    env:
      SONGBOARD_PUBLIC_SEARCH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nsgo-app/go.mod
          cache-dependency-path: nsgo-app/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run offline functional tests
        run: go test ./... -count=2 -skip '^(TestLiveDouyinConnection|TestPublicPlatformSearch)$'
      - name: Check NSGo project
        run: go tool nsgo check ./...
      - name: Check version rules
        run: node --test scripts/bump-patch.test.mjs
      - name: Run native tests and collect fresh screenshots
        run: go run ./scripts/native-acceptance
      - name: Upload evidence for separate visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-${{ matrix.os }}
          if-no-files-found: warn
          include-hidden-files: true
          path: nsgo-app/.nsgo/acceptance/
