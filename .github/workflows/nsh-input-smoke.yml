name: NSH Windows input-only test

on:
  push:
    branches:
      - test/native-inputs
    paths:
      - .github/workflows/nsh-input-smoke.yml
      - nsh/input-smoke/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nsh
    steps:
      - uses: actions/checkout@v4

      - name: Install NSH nightly
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:TEMP\nsh-windows-x86_64.zip"
          gh release download nightly --repo longbridge/nsh --pattern "nsh-windows-x86_64.zip" --dir $env:TEMP --clobber
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:TEMP\nsh-unpack" -Force
          $dest = "$env:LOCALAPPDATA\nsh"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$env:TEMP\nsh-unpack\nsh\*" -Destination $dest -Recurse -Force
          (Join-Path $dest "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install the tested Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rt = "$env:LOCALAPPDATA\nsh\runtime\windows"
          New-Item -ItemType Directory -Force -Path $rt | Out-Null
          $base = "https://github.com/fuyucn/nsh/releases/download/test-runtime-startup-3af9c133"
          Invoke-WebRequest "$base/nsh-windows-app.exe" -OutFile "$rt\nsh-windows-app.exe"
          Invoke-WebRequest "$base/nsh-windows-host.exe" -OutFile "$rt\nsh-windows-host.exe"

      - name: Package and verify the input-only app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class WindowCheck {
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr handle);
          }
          "@
          $testId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $appId = "com.sususongboard.nsh-input-smoke.$testId"
          $env:NSH_RUNTIME = Join-Path $env:LOCALAPPDATA "nsh\runtime"
          nsh package input-smoke --target windows -o dist --name NSHInputSmoke --id $appId
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath "$PWD\dist\NSHInputSmoke\NSHInputSmoke.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $app.Refresh()
          } while (-not $app.HasExited -and ($app.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($app.MainWindowHandle)) -and (Get-Date) -lt $deadline)
          if ($app.HasExited) { throw "Input-only app exited with code $($app.ExitCode)" }
          if ($app.MainWindowHandle -eq [IntPtr]::Zero -or -not [WindowCheck]::IsWindowVisible($app.MainWindowHandle)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "Input-only app did not create a visible main window"
          }
          Stop-Process -Id $app.Id -Force
          @{ testId = $testId; appId = $appId; runtimeCommit = "3af9c133" } |
            ConvertTo-Json | Set-Content dist\NSHInputSmoke\runtime-test.json
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DRUNTIME_TEST_ID=$testId" input-smoke\portable.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: NSH-Windows-Input-Test
          path: nsh/dist/NSH-Windows-Input-Test.exe
          if-no-files-found: error
