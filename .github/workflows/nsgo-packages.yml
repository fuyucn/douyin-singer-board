name: SongBoard packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    defaults:
      run:
        working-directory: nsgo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nsgo-app/go.mod
          cache-dependency-path: nsgo-app/go.sum
      - name: Verify release version
        shell: bash
        run: |
          [[ "$(uname -m)" == arm64 ]] || { echo "Expected a native arm64 runner, got $(uname -m)" >&2; exit 1; }
          version="$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | tr -d '"')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match nsgo.yaml version $version" >&2
            exit 1
          fi
          echo "NSGO_VERSION=$version" >> "$GITHUB_ENV"
      - name: Run offline tests
        run: go test ./... -count=2 -skip '^TestLiveDouyinConnection$'
      - name: Check NSGo project
        run: go tool nsgo check ./...
      - name: Build macOS package
        run: go tool nsgo build -target macos_arm64
      - name: Package and verify the portable macOS app
        shell: bash
        run: |
          app="dist/SUSUSongBoard-$NSGO_VERSION-macos_arm64/SUSUSongBoard.app"
          dmg="dist/releases/sususongboard-$NSGO_VERSION-macos-arm64.dmg"
          zip="dist/releases/sususongboard-$NSGO_VERSION-macos-arm64-portable.zip"
          [[ -d "$app" ]] || { echo "Missing app bundle: $app" >&2; exit 1; }
          [[ -f "$app/Contents/MacOS/SUSUSongBoard" ]] || { echo "App bundle executable is missing" >&2; exit 1; }
          [[ -f "$dmg" && -f "$dmg.sha256" ]] || { echo "Missing macOS disk image or checksum: $dmg" >&2; exit 1; }
          (cd dist/releases && shasum -a 256 -c "$(basename "$dmg").sha256")
          ditto -c -k --keepParent "$app" "$zip"
          mkdir -p "$RUNNER_TEMP/nsgo-macos-portable-verify"
          ditto -x -k "$zip" "$RUNNER_TEMP/nsgo-macos-portable-verify"
          [[ -f "$RUNNER_TEMP/nsgo-macos-portable-verify/SUSUSongBoard.app/Contents/MacOS/SUSUSongBoard" ]] || { echo "Portable app archive is incomplete" >&2; exit 1; }
          (cd dist/releases && shasum -a 256 "$(basename "$zip")" > "$(basename "$zip").sha256")
          (cd dist/releases && shasum -a 256 -c "$(basename "$zip").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-macos-arm64
          if-no-files-found: error
          path: |
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-macos-arm64.dmg
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-macos-arm64.dmg.sha256
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-macos-arm64-portable.zip
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-macos-arm64-portable.zip.sha256

  windows:
    name: Windows x64 portable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nsgo-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nsgo-app/go.mod
          cache-dependency-path: nsgo-app/go.sum
      - name: Verify release version
        shell: pwsh
        run: |
          $match = Select-String -Path nsgo.yaml -Pattern '^version:\s*"?([^"]+)"?$'
          if ($null -eq $match) { throw 'Could not read the NSGo app version from nsgo.yaml.' }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match nsgo.yaml version $version"
          }
          "NSGO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run offline tests
        run: go test ./... -count=2 -skip '^TestLiveDouyinConnection$'
      - name: Check NSGo project
        run: go tool nsgo check ./...
      - name: Build Windows app without an installer
        run: go tool nsgo build -target windows_x64 -installers=false
      - name: Package and verify the portable app
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD ("dist/SUSUSongBoard-{0}-windows_x64" -f $env:NSGO_VERSION)
          $exe = Join-Path $packageDir 'SUSUSongBoard.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Missing portable app executable: $exe" }
          $releaseDir = Join-Path $PWD 'dist/releases'
          $zip = Join-Path $releaseDir ("sususongboard-{0}-windows-x64-portable.zip" -f $env:NSGO_VERSION)
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($packageDir, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'SUSUSongBoard.exe' }
            if ($null -eq $entry) { throw 'The portable ZIP does not contain the application executable.' }
            $archiveNames = $archive.Entries | ForEach-Object { $_.FullName }
            $sourceFiles = Get-ChildItem -LiteralPath $packageDir -File -Recurse | ForEach-Object { $_.FullName.Substring($packageDir.Length + 1).Replace('\', '/') }
            foreach ($file in $sourceFiles) {
              if ($file -notin $archiveNames) { throw "The portable ZIP is missing $file" }
            }
          } finally {
            $archive.Dispose()
          }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SUSUSongBoard-windows-x64-portable
          if-no-files-found: error
          path: |
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-windows-x64-portable.zip
            nsgo-app/dist/releases/sususongboard-${{ env.NSGO_VERSION }}-windows-x64-portable.zip.sha256
